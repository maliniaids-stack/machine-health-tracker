<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Condition Monitoring</title>
    <!-- Modern Typography: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation (if any) or Header -->
        <header class="top-nav">
            <div class="logo">
                <div class="logo-circle"></div>
                <h1>MCM Dashboard</h1>
            </div>
            <div class="nav-controls">
                <button id="refreshBtn" class="btn primary">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    Refresh Data
                </button>
            </div>
        </header>

        <main class="dashboard-grid">
            <!-- KPIs / Overview -->
            <section class="kpi-section">
                <div class="glass-card kpi-card">
                    <h3>Machine Status</h3>
                    <div id="latestStatus" class="status-indicator status-normal">
                        <span class="status-dot"></span>
                        <span class="status-text">Normal</span>
                    </div>
                </div>
                <div class="glass-card kpi-card">
                    <h3>Temperature</h3>
                    <div class="kpi-value"><span id="latestTemp">--</span><span class="unit">°C</span></div>
                </div>
                <div class="glass-card kpi-card">
                    <h3>Vibration (RMS)</h3>
                    <div class="kpi-value"><span id="latestVib">--</span><span class="unit">g</span></div>
                </div>
            </section>

            <!-- Filters -->
            <section class="filter-section glass-card">
                <div class="filter-group">
                    <label for="machineSelect">Select Machine</label>
                    <select id="machineSelect">
                        <option value="">All Machines</option>
                        <option value="node_001">node_001 (Main Motor)</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="timeLimit">History Limit</label>
                    <select id="timeLimit">
                        <option value="50">Last 50</option>
                        <option value="100" selected>Last 100</option>
                        <option value="500">Last 500</option>
                    </select>
                </div>
            </section>

            <!-- Charts -->
            <section class="charts-section">
                <div class="glass-card chart-container">
                    <div class="chart-header">
                        <h2>Temperature Trend</h2>
                    </div>
                    <canvas id="temperatureChart"></canvas>
                </div>
                <div class="glass-card chart-container">
                    <div class="chart-header">
                        <h2>Vibration Analysis</h2>
                    </div>
                    <canvas id="vibrationChart"></canvas>
                </div>
            </section>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
